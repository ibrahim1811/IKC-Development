<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı - IKC Development</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;
    color:#ffffff;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:480px}
  .code{
    font-family:'Space Grotesk',sans-serif;
    font-size:96px;
    font-weight:700;
    background:linear-gradient(135deg,#ff5722,#ffc107);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    margin:16px 0 12px;
  }
  p{
    color:#b0b0b0;
    font-size:15px;
    line-height:1.6;
    margin-bottom:28px;
  }
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#ff5722;
    color:#fff;
    text-decoration:none;
    font-weight:600;
    padding:14px 28px;
    border-radius:12px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  a.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,87,34,0.4);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Ana sayfaya dönüp aradığınızı orada bulabilirsiniz.</p>
    <a href="/" class="btn">← Ana Sayfaya Dön</a>
  </div>
</body>
</html>
