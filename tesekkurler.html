<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teşekkürler - IKC Development</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;
    color:#fff;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:480px}
  .check{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#ff5722,#ffc107);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;font-size:32px;
  }
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin-bottom:12px}
  p{color:#b0b0b0;font-size:15px;line-height:1.6;margin-bottom:28px}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#ff5722;color:#fff;text-decoration:none;
    font-weight:600;padding:14px 28px;border-radius:12px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,87,34,0.4)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="check">✓</div>
    <h1>Mesajınız Alındı!</h1>
    <p>Teşekkürler, mesajınız bize ulaştı. En kısa sürede size dönüş yapacağız.</p>
    <a href="/" class="btn">← Ana Sayfaya Dön</a>
  </div>
</body>
</html>
